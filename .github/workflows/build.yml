name: Build Cross-Platform Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - name: 讀取程式碼
      uses: actions/checkout@v4
    
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller insightface opencv-python numpy PySide6 PyYAML
        
    - name: 執行 PyInstaller 打包 (Mac)
      run: |
        python -m PyInstaller \
          --noconsole \
          --clean \
          --collect-all ai_video \
          --collect-all PySide6 \
          --collect-all insightface \
          --hidden-import=binascii \
          --hidden-import=zipfile \
          --hidden-import=yaml \
          run.py
          
    - name: 上傳 Mac 執行檔
      uses: actions/upload-artifact@v4
      with:
        name: ai-video-macos-x64
        path: dist/run/
