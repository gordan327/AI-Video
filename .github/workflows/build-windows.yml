name: Build Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # 或 windows-latest，這裡用 ubuntu 可以一次打包或分開

    steps:
    - name: 讀取程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller insightface opencv-python numpy PyQt5

    - name: 執行 PyInstaller 打包
      run: |
        python -m PyInstaller --noconsole --clean --collect-all ai_video run.py

    - name: 上傳執行檔
      uses: actions/upload-artifact@v4
      with:
        name: ai-video-artifact
        path: dist/run/
