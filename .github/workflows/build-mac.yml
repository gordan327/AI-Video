name: Mac Build (PyInstaller)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 shiboken6 insightface onnxruntime opencv-python scipy pyyaml pyinstaller
          pip install -r requirements.txt
          pip install -e .

      - name: Install FFmpeg via Homebrew
        run: |
          brew install ffmpeg

      - name: Build macOS App with PyInstaller
        run: |
          export PYTHONUTF8=1
          export PYTHONPATH="src"
          pyinstaller mac_build.spec

      - name: Create DMG Installer Package
        run: |
          brew install create-dmg
          mkdir -p dist_dmg
          create-dmg \
            --volname "AI-Video Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AI-Video.app" 175 120 \
            --hide-extension "AI-Video.app" \
            --app-drop-link 425 120 \
            "dist_dmg/AI-Video-Mac-Installer.dmg" \
            "dist/AI-Video.app"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Mac-Installer
          path: dist_dmg/AI-Video-Mac-Installer.dmg