name: macOS Build & DMG Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'develop/*'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip & install Nuitka
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka zstandard create-dmg

      - name: Install FFmpeg via Homebrew
        run: |
          brew install ffmpeg

      - name: Install Dependencies & Local Project
        run: |
          python -m pip install onnxruntime opencv-python PySide6 scipy pyyaml ultralytics
          python -m pip install -e .

      - name: Build macOS App with Nuitka
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          echo "FFmpeg Location: $FFMPEG_PATH"

          ICON_ARG=""
          if [ -f "assets/icon.icns" ]; then
              ICON_ARG="--macos-app-icon=assets/icon.icns"
          fi

          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            $ICON_ARG \
            --enable-plugin=pyside6 \
            --include-package=ai_video \
            --include-package=scipy \
            --include-data-dir=src/ai_video/config=ai_video/config \
            --include-data-files="$FFMPEG_PATH=ffmpeg" \
            --output-dir=dist \
            --nofollow-import-to=sympy \
            --nofollow-import-to=mpmath \
            --nofollow-import-to=torch \
            --nofollow-import-to=torchvision \
            --nofollow-import-to=torchaudio \
            --nofollow-import-to=triton \
            --nofollow-import-to=pytest \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=fonttools \
            --nofollow-import-to=contourpy \
            --nofollow-import-to=kiwisolver \
            --nofollow-import-to=cycler \
            --nofollow-import-to=nvidia_ml_py \
            --nofollow-import-to=IPython \
            --nofollow-import-to=notebook \
            src/ai_video/gui/app.py

      - name: Create Drag-and-Drop .dmg Package
        run: |
          mkdir -p dist_dmg
          create-dmg \
            --volname "AI-Video-Installer" \
            --volicon "assets/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "app.app" 175 120 \
            --hide-extension "app.app" \
            --app-drop-link 425 120 \
            "dist_dmg/AI-Video-macOS.dmg" \
            "dist/app.app"

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-macOS-Installer
          path: dist_dmg/AI-Video-macOS.dmg