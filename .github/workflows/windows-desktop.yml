name: Windows Desktop Build

on:
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: |
          python -m pip install -e .
          python -m pip install pytest
          python -m pip install "Nuitka>=4.1,<4.2"
          python -m pip install ordered-set zstandard

      - name: Show build environment
        run: |
          python --version
          python -m nuitka --version

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows desktop application
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --module-parameter=torch-disable-jit=yes `
            --include-data-dir=src/ai_video/config=ai_video/config `
            --include-module=scipy._external.array_api_compat.numpy.fft `
            --output-dir=desktop-build `
            src/ai_video/gui/app.py

      - name: Inspect build output
        shell: pwsh
        run: |
          Write-Host "Windows desktop build output:"
          Get-ChildItem -Path desktop-build -Recurse |
            Select-Object FullName, Length

      - name: Prepare distribution directory
        shell: pwsh
        run: |
          $sourceDirectory = "desktop-build/app.dist"
          $targetDirectory = "dist/AI-Video"

          if (-not (Test-Path $sourceDirectory)) {
            throw "Nuitka output directory was not found: $sourceDirectory"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetDirectory

          Copy-Item `
            -Path "$sourceDirectory/*" `
            -Destination $targetDirectory `
            -Recurse `
            -Force

          if (Test-Path "$targetDirectory/app.exe") {
            Rename-Item `
              -Path "$targetDirectory/app.exe" `
              -NewName "AI-Video.exe"
          }
          else {
            throw "Windows executable was not found: $targetDirectory/app.exe"
          }

      - name: Create Windows ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/AI-Video" `
            -DestinationPath "dist/AI-Video-Windows.zip" `
            -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Windows
          path: dist/AI-Video-Windows.zip
          if-no-files-found: error
          retention-days: 14
