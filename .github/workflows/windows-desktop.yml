name: Windows Desktop Build

on:
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: |
          python -m pip install -e .
          python -m pip install pytest
          python -m pip install "Nuitka>=4.1,<4.2"
          python -m pip install ordered-set zstandard

      - name: Show build environment
        run: |
          python --version
          python -m nuitka --version

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows desktop application
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --clang `
            --low-memory `
            --module-parameter=torch-disable-jit=yes `
            --include-data-dir=src/ai_video/config=ai_video/config `
            --include-module=scipy._external.array_api_compat.numpy.fft `
            --output-dir=desktop-build `
            src/ai_video/gui/app.py

      - name: Inspect build output
        shell: pwsh
        run: |
          Write-Host "Windows desktop build output:"

          Get-ChildItem -Path desktop-build -Recurse |
            Select-Object FullName, Length

      - name: Download Windows FFmpeg
        shell: pwsh
        run: |
          $ffmpegArchive = Join-Path `
            $env:RUNNER_TEMP `
            "ffmpeg-windows.zip"

          $ffmpegExtractDirectory = Join-Path `
            $env:RUNNER_TEMP `
            "ffmpeg-windows"

          $ffmpegDownloadUrl = `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

          Write-Host "Downloading FFmpeg from:"
          Write-Host $ffmpegDownloadUrl

          Invoke-WebRequest `
            -Uri $ffmpegDownloadUrl `
            -OutFile $ffmpegArchive

          if (-not (Test-Path $ffmpegArchive)) {
            throw "FFmpeg archive was not downloaded."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $ffmpegExtractDirectory |
            Out-Null

          Expand-Archive `
            -Path $ffmpegArchive `
            -DestinationPath $ffmpegExtractDirectory `
            -Force

          $ffmpegExecutable = Get-ChildItem `
            -Path $ffmpegExtractDirectory `
            -Filter "ffmpeg.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $ffmpegExecutable) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }

          Write-Host "FFmpeg executable found:"
          Write-Host $ffmpegExecutable.FullName

          "FFMPEG_EXECUTABLE=$($ffmpegExecutable.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Prepare distribution directory
        shell: pwsh
        run: |
          $sourceDirectory = "desktop-build/app.dist"
          $targetDirectory = "dist/AI-Video"
          $targetBinDirectory = "$targetDirectory/bin"

          if (-not (Test-Path $sourceDirectory)) {
            throw `
              "Nuitka output directory was not found: $sourceDirectory"
          }

          if (-not (Test-Path $env:FFMPEG_EXECUTABLE)) {
            throw `
              "Downloaded FFmpeg executable was not found: $env:FFMPEG_EXECUTABLE"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetDirectory |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetBinDirectory |
            Out-Null

          Copy-Item `
            -Path "$sourceDirectory/*" `
            -Destination $targetDirectory `
            -Recurse `
            -Force

          Copy-Item `
            -Path $env:FFMPEG_EXECUTABLE `
            -Destination "$targetBinDirectory/ffmpeg.exe" `
            -Force

          if (Test-Path "$targetDirectory/app.exe") {
            Rename-Item `
              -Path "$targetDirectory/app.exe" `
              -NewName "AI-Video.exe"
          }
          else {
            throw `
              "Windows executable was not found: $targetDirectory/app.exe"
          }

      - name: Verify Windows distribution
        shell: pwsh
        run: |
          $applicationExecutable = `
            "dist/AI-Video/AI-Video.exe"

          $ffmpegExecutable = `
            "dist/AI-Video/bin/ffmpeg.exe"

          $configurationFile = `
            "dist/AI-Video/ai_video/config/config.yaml"

          if (-not (Test-Path $applicationExecutable)) {
            throw `
              "AI-Video.exe was not found: $applicationExecutable"
          }

          if (-not (Test-Path $ffmpegExecutable)) {
            throw `
              "Bundled ffmpeg.exe was not found: $ffmpegExecutable"
          }

          if (-not (Test-Path $configurationFile)) {
            throw `
              "Bundled config.yaml was not found: $configurationFile"
          }

          Write-Host "AI-Video executable:"
          Get-Item $applicationExecutable |
            Select-Object FullName, Length

          Write-Host "FFmpeg executable:"
          Get-Item $ffmpegExecutable |
            Select-Object FullName, Length

          Write-Host "Configuration file:"
          Get-Item $configurationFile |
            Select-Object FullName, Length

          Write-Host "Bundled FFmpeg version:"
          & $ffmpegExecutable `
            -hide_banner `
            -version

          if ($LASTEXITCODE -ne 0) {
            throw `
              "Bundled ffmpeg.exe failed with exit code $LASTEXITCODE."
          }

      - name: Create Windows ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/AI-Video" `
            -DestinationPath "dist/AI-Video-Windows.zip" `
            -Force

          if (-not (Test-Path "dist/AI-Video-Windows.zip")) {
            throw "Windows ZIP package was not created."
          }

          Write-Host "Windows ZIP package:"
          Get-Item "dist/AI-Video-Windows.zip" |
            Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $installerScript = "installer/windows/AI-Video.iss"
          $installerOutput = "dist/AI-Video-Setup-v1.0.1.exe"

          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found: $compiler"
          }

          if (-not (Test-Path $installerScript)) {
            throw "Installer script was not found: $installerScript"
          }

          & $compiler $installerScript

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $installerOutput)) {
            throw "Windows installer was not created: $installerOutput"
          }

          Write-Host "Windows installer:"
          Get-Item $installerOutput |
            Select-Object FullName, Length

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Windows
          path: dist/AI-Video-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Windows-Installer
          path: dist/AI-Video-Setup-v1.0.1.exe
          if-no-files-found: error
          retention-days: 14