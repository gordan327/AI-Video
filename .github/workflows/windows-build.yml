name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'develop/*'

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

  build-windows:
    needs: test-windows
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip & install Nuitka
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka zstandard

      - name: Install FFmpeg & Inno Setup via Chocolatey
        run: |
          choco install ffmpeg -y
          choco install innosetup -y

      - name: Install Lightweight Dependencies
        run: |
          python -m pip install onnxruntime opencv-python PySide6 scipy pyyaml ultralytics

      - name: Build Windows Executable with Nuitka
        shell: powershell
        run: |
          $env:PYTHONUTF8 = "1"
          $FFMPEG_PATH = (Get-Command ffmpeg.exe).Source
          Write-Host "FFmpeg Location: $FFMPEG_PATH"

          # 判斷是否有 ico 圖示，有則掛載
          $ICON_ARG = ""
          if (Test-Path "assets/icon.ico") {
              $ICON_ARG = "--windows-icon-from-ico=assets/icon.ico"
          }

          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --jobs=2 `
            --low-memory `
            --windows-console-mode=force `
            --enable-plugin=pyside6 `
            --include-qt-plugins=sensible,platforms `
            --include-package=scipy `
            --include-package=sympy `
            --include-data-dir=src/ai_video/config=ai_video/config `
            --include-data-files="$FFMPEG_PATH=ffmpeg.exe" `
            $ICON_ARG `
            --output-dir=dist `
            --nofollow-import-to=torch `
            --nofollow-import-to=torchvision `
            --nofollow-import-to=torchaudio `
            --nofollow-import-to=triton `
            --nofollow-import-to=pytest `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=IPython `
            --nofollow-import-to=notebook `
            src/ai_video/gui/app.py